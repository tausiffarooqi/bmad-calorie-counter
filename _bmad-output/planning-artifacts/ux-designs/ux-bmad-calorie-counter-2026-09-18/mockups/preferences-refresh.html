<!--
  Direction: Warm Editorial Refresh (2026-09-26) -- Account / Preferences
  Same fields/copy/per-field-save pattern as today's real screen (see
  docs/screenshots/03-account-preferences-page.jpg), re-skinned with the
  new palette + soft shadow, plus the new Name field (2026-09-26) using
  the exact same labeled-input + inline "Save" button treatment as the
  existing Daily Calorie Target field -- no new component introduced.

  SUPERSEDED (2026-09-27, see DESIGN.md's Button (primary) entry): the
  three .btn-save elements below still show the original muted/outline
  treatment (background: var(--card), bordered). Direct user request
  changed the real Save buttons to the primary/filled treatment instead
  (same color as the Log in button) -- this mockup was not updated to
  match; treat DESIGN.md as authoritative for Save-button color.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Direction: Warm Editorial Refresh -- Account &amp; Preferences</title>
<style>
  :root {
    --bg: #F7F6F2;
    --card: #FFFFFF;
    --text: #27302E;
    --text-muted: #69736D;
    --primary: #C66C4D;
    --border: #E5E3DB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px;
    background: #EAE7DF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  .frame-label {
    text-align: center;
    font-size: 13px;
    color: #6E6656;
    margin-bottom: 10px;
    letter-spacing: 0.03em;
    max-width: 320px;
  }
  .phone {
    width: 320px;
    height: 640px;
    background: var(--bg);
    border-radius: 28px;
    border: 8px solid #27302E;
    overflow: hidden;
    position: relative;
    color: var(--text);
  }
  .screen {
    padding: 28px 22px;
    height: 100%;
  }
  .back-link {
    font-size: 13px;
    color: var(--primary);
    margin: 0 0 24px;
  }
  .pref-card {
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 10px 28px rgba(39, 48, 46, 0.08);
  }
  h1 {
    font-size: 19px;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 16px 0;
  }
  .field-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    margin-bottom: 18px;
  }
  .field-row .field { flex: 1; }
  .field label { margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  .btn-save {
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .radio-group {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .radio-option {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .radio-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
  }
  .radio-dot.checked {
    border-color: var(--primary);
    background: radial-gradient(circle, var(--primary) 0 5px, transparent 6px);
  }
</style>
</head>
<body>

<div>
  <div class="frame-label">Account &amp; Preferences — same layout/fields as today, new palette + soft shadow, plus the new Name field (top)</div>
  <div class="phone"><div class="screen">
    <p class="back-link">&larr; Back to Daily view</p>
    <div class="pref-card">
      <h1>Account &amp; Preferences</h1>

      <div class="field-row">
        <div class="field">
          <label>Name</label>
          <input type="text" value="Alex" />
        </div>
        <div class="btn-save">Save</div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Daily Calorie Target</label>
          <input type="text" value="2000" />
        </div>
        <div class="btn-save">Save</div>
      </div>

      <label style="margin-bottom: 8px;">Dietary Preference</label>
      <div class="radio-group">
        <div class="radio-option"><div class="radio-dot"></div> Vegetarian</div>
        <div class="radio-option"><div class="radio-dot checked"></div> Non-vegetarian</div>
      </div>
      <div class="btn-save">Save</div>
    </div>
  </div></div>
</div>

</body>
</html>
