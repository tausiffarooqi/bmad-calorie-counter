<!--
  Direction: Warm Editorial Refresh (2026-09-26) -- Login & Register
  Same layout, fields, and copy as today's real screens (see
  docs/screenshots/01-login-page.jpg / 02-registration-page.jpg) -- only the
  palette and shadows change: white card (was a warm off-white tint),
  terracotta primary button and links (was clay), soft shadow under the
  card and the button, new border color for inputs.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Direction: Warm Editorial Refresh -- Login &amp; Register</title>
<style>
  :root {
    --bg: #F7F6F2;
    --card: #FFFFFF;
    --text: #27302E;
    --text-muted: #69736D;
    --primary: #C66C4D;
    --border: #E5E3DB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px;
    background: #EAE7DF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: center;
  }
  .frame-label {
    text-align: center;
    font-size: 13px;
    color: #6E6656;
    margin-bottom: 10px;
    letter-spacing: 0.03em;
    max-width: 320px;
  }
  .phone {
    width: 320px;
    height: 640px;
    background: var(--bg);
    border-radius: 28px;
    border: 8px solid #27302E;
    overflow: hidden;
    position: relative;
    color: var(--text);
  }
  .screen {
    padding: 28px 22px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .auth-card {
    width: 100%;
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 28px rgba(39, 48, 46, 0.10);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .field {
    margin-bottom: 14px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
  }
  .btn-primary {
    width: 100%;
    margin-top: 6px;
    padding: 12px 0;
    text-align: center;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    background: var(--primary);
    color: #FFFFFF;
    border: none;
    box-shadow: 0 6px 16px rgba(198, 108, 77, 0.25);
  }
  .switch-link {
    margin-top: 16px;
    font-size: 13px;
    color: var(--primary);
    text-align: left;
  }
</style>
</head>
<body>

<div>
  <div class="frame-label">Log in — same fields/copy as today, new palette + soft shadow</div>
  <div class="phone"><div class="screen">
    <div class="auth-card">
      <h1>Log in</h1>
      <div class="field"><label>Email</label><input type="email" /></div>
      <div class="field"><label>Password</label><input type="password" /></div>
      <div class="btn-primary">Log in</div>
      <p class="switch-link">Don't have an account? Register</p>
    </div>
  </div></div>
</div>

<div>
  <div class="frame-label">Create account — new palette + soft shadow, plus a new Name field (2026-09-26, used for the Daily view's greeting)</div>
  <div class="phone"><div class="screen">
    <div class="auth-card">
      <h1>Create your account</h1>
      <div class="field"><label>Name</label><input type="text" placeholder="e.g. Alex" /></div>
      <div class="field"><label>Email</label><input type="email" /></div>
      <div class="field"><label>Password</label><input type="password" /></div>
      <div class="field"><label>Confirm password</label><input type="password" /></div>
      <div class="field"><label>Daily Calorie Target</label><input type="text" value="2000" /></div>
      <div class="btn-primary">Create account</div>
      <p class="switch-link">Already have an account? Log in</p>
    </div>
  </div></div>
</div>

</body>
</html>
